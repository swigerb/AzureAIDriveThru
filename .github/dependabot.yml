version: 2
updates:
  - package-ecosystem: devcontainers
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app/frontend
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - /app/backend
      - /tests/conformance
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories:
      - /app/backend-dotnet
      - /tests/conformance
      - /tools/dotnet
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /app
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
