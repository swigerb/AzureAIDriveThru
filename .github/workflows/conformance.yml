name: Conformance Suite

"on":
  pull_request:
    branches: [dev, main]
  push:
    # Issue #24: catch anything that reached dev without going through this workflow as a
    # PR check (e.g. an administrator merge, or a merge commit built from a stale base).
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  # #28 S1 (Rick's PR #52 review): only cancel in-progress runs for pull_request events. Without
  # this, the push-to-dev trigger (#24) shares the same concurrency group as its branch ref, so
  # rapid successive merges to dev cancel each other's runs -- the earlier commit's run goes
  # `cancelled` and shows red, even though nothing about that commit failed. #24 added the push
  # trigger specifically so every commit that reaches dev gets checked; a merge cancelling that
  # check defeats the purpose. PR runs (one ref per open PR, only the latest push matters) still
  # get the superseded-run cancellation benefit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep these two in sync with global.json (repo root).
  DOTNET_VERSION: "11.0.100-rc.1.26425.128"
  PYTHON_VERSION: "3.12"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # Part of issue #11 (S1.5): Python unit tests, run on every PR to dev/main.
  python-tests:
    name: Python backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          # Dev-only tooling: not in requirements.txt (that file is the
          # backend's runtime dependency set), pinned to the versions this
          # branch was validated against.
          pip install ruff==0.16.1 pytest==9.1.1 pytest-asyncio==1.4.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Build frontend (app/backend/static is gitignored and required by app.py's add_static)
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: ruff check
        run: ruff check .

      - name: pytest
        run: |
          set -o pipefail
          python -m pytest app/backend/tests -q --junitxml=pytest-results.xml 2>&1 | tee pytest-output.log

      # PR #101 round 3 (Rick's review, optional/recommended): the regen script's
      # --allow-increase refusal only protects people who run it -- nothing stops a hand-edit
      # of rebrand_baseline.yaml that skips it entirely. This step makes any such raise (or
      # brand-new entry) visible in CI by diffing the checked-in baseline against the PR's
      # base branch and failing if the increase/new-entry lacks a valid `increase_reason`.
      # Only meaningful on pull_request events, where github.base_ref is set.
      - name: Rebrand baseline ratchet vs base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          # `|| true`: if the base branch predates rebrand_baseline.yaml, git show exits
          # non-zero and (with bash's default -e for run steps) would abort the step before
          # the python script's own graceful "not found -- skipping" fallback gets a chance to
          # run. Tolerating the failure here leaves an empty/missing file, which the script
          # already handles as "nothing to ratchet against yet".
          git show "origin/${{ github.base_ref }}:app/backend/tests/rebrand_baseline.yaml" \
            > base-rebrand-baseline.yaml || true
          python app/backend/tests/check_rebrand_baseline_against_base.py base-rebrand-baseline.yaml

      - name: Upload pytest results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-tests-results
          path: |
            pytest-results.xml
            pytest-output.log
          retention-days: 7

  # Part of issue #11 (S1.5): frontend build + tests, run on every PR to dev/main.
  frontend-tests:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: npm ci
        working-directory: app/frontend
        run: npm ci

      - name: npm run build
        working-directory: app/frontend
        run: npm run build

      - name: npm test
        working-directory: app/frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../../frontend-test-output.log

      - name: Upload frontend test output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-tests-results
          path: |
            frontend-test-output.log
            app/frontend/coverage
          retention-days: 7

  # Part of issue #12 (S2, PR #96 review required item 3): C# backend unit tests
  # (app/backend-dotnet/tests/Backend.Tests), run on every PR to dev/main. Purely additive --
  # does NOT touch the `conformance` matrix's `backend: [python]` axis above, which stays
  # Birdperson's #76 to extend with a `dotnet` entry. This job only builds/runs
  # app/backend-dotnet's own xUnit suite; it does not run the conformance suite at all.
  dotnet-tests:
    name: C# backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('app/backend-dotnet/Directory.Packages.props', 'app/backend-dotnet/**/*.csproj', 'app/backend-dotnet/**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: dotnet restore app/backend-dotnet (locked mode)
        working-directory: app/backend-dotnet
        # Same rationale as the `conformance` job's identically-named step: RestorePackagesWithLockFile=true
        # (Directory.Build.props) means packages.lock.json fully pins the resolved graph, so
        # --locked-mode fails loudly instead of silently re-resolving if the committed lock file
        # and Directory.Packages.props/*.csproj ever disagree.
        run: dotnet restore Backend.slnx --locked-mode

      - name: dotnet test app/backend-dotnet
        working-directory: app/backend-dotnet
        run: |
          set -o pipefail
          dotnet test Backend.slnx \
            --no-restore \
            --logger "trx;LogFileName=backend-tests.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory TestResults \
            --blame-hang --blame-hang-timeout 10min --blame-hang-dump-type mini \
            --blame-crash --blame-crash-dump-type mini \
            2>&1 | tee backend-tests-output.log

      - name: Upload C# backend test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-backend-tests-results
          path: |
            app/backend-dotnet/TestResults
            app/backend-dotnet/backend-tests-output.log
          retention-days: 7

  # Part of issue #7 (S1.1) / #11 (S1.5): the shared black-box conformance suite, against every
  # backend it can currently run.
  #
  # Backend axis: "python" runs the full suite (matching PythonBackendLauncher's real relay/order
  # pipeline). #76 added "dotnet" here once the C# skeleton (issue #12 S2) had a health/config/
  # persona-pack/static-files surface worth gating on -- it deliberately does NOT run the full
  # suite (the skeleton has no realtime relay or order pipeline yet), only the scenarios tagged
  # `[Trait("Dotnet", "ready")]` (docs/dotnet_mapping.md: 11 scenarios today, grown by a
  # `DotnetTraitCoverageTests` floor of >= 11 so the count can't silently shrink). Before this,
  # CONFORMANCE_BACKEND=dotnet FAILED the suite by default in CI on purpose (PR #22 review item
  # 15 -- DotnetPlaceholderPolicy/CiEnvironment.IsCi always ignore the CONFORMANCE_ALLOW_SKIP=1
  # opt-in when GITHUB_ACTIONS=true), precisely so CI could never silently report green with zero
  # real backend coverage; the dotnet leg below now gets real (if partial) coverage instead of
  # being skipped.
  #
  # Persona axis: intentionally not a matrix axis. CONFORMANCE_PERSONAS is left unset, so
  # ConformancePersonas' own disk discovery enables every pack under personas/ that exists on
  # disk (today: just Sonic) -- the same behaviour the backend itself falls back to. This means
  # #78/#79 landing more persona packs needs no workflow edit at all; if run time ever requires
  # sharding by persona, that can be added later (design doc section 8: "the suite's run time
  # grows ... it is sharded if needed"). Model/pipeline axes are a later wave (design doc
  # section 8); a new `matrix:` key plus, if a leg needs a different filter, another conditional
  # step like the dotnet-only ones below is how they'd slot in.
  conformance:
    name: Conformance suite (backend=${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [python, dotnet]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.backend == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Create Python venv for the backend under test
        # PythonBackendLauncher (tests/conformance/src/Conformance.Harness)
        # expects a .venv at the repo root with the backend's runtime deps
        # installed -- exactly what a developer's local checkout has. Only the
        # python leg launches a Python process at all.
        if: matrix.backend == 'python'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r app/backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Build frontend (app/backend/static is gitignored and required by app.py's/Program.cs's static-file serving)
        # Both backends serve the same built frontend (app/backend-dotnet/src/Backend/Program.cs's
        # TryFindStaticDir falls back to app/backend/static too) -- StaticIndexHtmlTests is part of
        # the dotnet leg's scoped subset, so this step isn't python-only.
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('tests/conformance/Directory.Packages.props', 'tests/conformance/**/*.csproj', 'tests/conformance/**/packages.lock.json', 'app/backend-dotnet/Directory.Packages.props', 'app/backend-dotnet/**/*.csproj', 'app/backend-dotnet/**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: dotnet restore tests/conformance (locked mode)
        working-directory: tests/conformance
        # Issue #24: every project restores RestorePackagesWithLockFile=true (Directory.Build.props),
        # so packages.lock.json fully pins the resolved graph including transitives. --locked-mode
        # makes CI fail loudly instead of silently re-resolving if a committed lock file and
        # Directory.Packages.props/*.csproj ever disagree (e.g. a version bump landed in one but
        # not the other, or a feed started serving a different transitive graph).
        run: dotnet restore Conformance.slnx --locked-mode

      - name: dotnet restore and build app/backend-dotnet (dotnet leg only)
        # Pre-restoring/building here (same --locked-mode convention as the dotnet-tests job
        # above) means DotnetBackendLauncher's `dotnet run` at test time has nothing left to do
        # but start the already-built process -- so a cold restore/build never eats into
        # WaitForHealthAsync's 60s health-check timeout.
        if: matrix.backend == 'dotnet'
        working-directory: app/backend-dotnet
        run: |
          dotnet restore Backend.slnx --locked-mode
          dotnet build Backend.slnx --no-restore

      - name: dotnet test tests/conformance
        working-directory: tests/conformance
        env:
          # Resolved from a repo-root-relative .venv by PythonBackendLauncher (python leg only);
          # DotnetBackendLauncher resolves app/backend-dotnet directly instead.
          CONFORMANCE_BACKEND: ${{ matrix.backend }}
          # Issue #76 (Rick's PR #101 review item 2): deliberately left unset -- ConformancePersonas'
          # own disk discovery already resolves to every pack under personas/ that exists today
          # (just Sonic), exactly matching the backend's own un-overridden fallback. Set this
          # explicitly only if run time ever requires shrinking the enabled set for a given leg.
        run: |
          set -o pipefail
          if [ "${{ matrix.backend }}" = "dotnet" ]; then
            # #76 (Rick's PR #101 review item 1): only the scenarios tagged
            # [Trait("Dotnet", "ready")] -- exactly the set docs/dotnet_mapping.md documents as
            # green against the C# skeleton (health/auth-token/static-index/origin-validation
            # subset; 11 scenarios today, floor-checked by DotnetTraitCoverageTests) -- the
            # skeleton has no realtime relay or order pipeline yet (issue #12 S2 scope), so the
            # full suite's remaining scenarios would fail for a reason unrelated to this leg's
            # actual purpose. Growing dotnet coverage (C# PRs #13-#16) means adding the trait in
            # the test files themselves; this filter and DotnetTraitCoverageTests' floor both pick
            # up a newly tagged scenario automatically, with no workflow edit.
            FILTER='Dotnet=ready&Category!=Browser'
          else
            FILTER='Category!=Browser'
          fi
          dotnet test Conformance.slnx \
            --no-restore \
            --filter "${FILTER}" \
            --logger "trx;LogFileName=conformance.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory TestResults \
            --blame-hang --blame-hang-timeout 10min --blame-hang-dump-type mini \
            --blame-crash --blame-crash-dump-type mini \
            2>&1 | tee conformance-output.log
          # PR #22 review item 17: a hung scenario (e.g. a broken await-with-timeout, or the
          # Python backend wedged and never answering /health) must produce a crash/hang dump and
          # fail the job well before the job-level timeout-minutes kill, instead of silently
          # eating the whole 20-minute budget with no diagnostic artifact at all.
          #
          # PR #54 review (blocker B2): without --filter "Category!=Browser", this job ran the
          # Category=Browser scenarios too (its own dotnet test has no filter), directly
          # contradicting conformance-browser's rationale below that a real-browser
          # failure/timeout "can never block or slow down the fast black-box … scenarios" -- the
          # CI log for run 36107586429 showed all 5 OrderResumeBrowserTests running in both jobs.

      - name: Upload conformance test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results-${{ matrix.backend }}
          path: |
            tests/conformance/TestResults
            tests/conformance/conformance-output.log
          retention-days: 7

  # Issues #10 / #26: the Category=Browser real-browser subset of the conformance suite
  # (tests/conformance/tests/Conformance.Tests/Scenarios/Browser), kept as its own job -- not
  # folded into the `conformance` matrix above -- so a real-browser failure/timeout can never
  # block or slow down the fast black-box HTTP/WebSocket-only scenarios (see the main job's own
  # --filter "Category!=Browser", added in the PR #54 review), and so its runner-provided-browser
  # dependency stays isolated. ubuntu-latest ships Google Chrome stable (see actions/runner-images),
  # which Conformance.Harness.BrowserChannelPolicy auto-detects at /usr/bin/google-chrome --
  # Playwright launches it by channel ("chrome"), so this job never downloads a browser.
  # Microsoft.Playwright's own Node driver ships inside the NuGet package restored below, from
  # this runner's default NuGet feed -- the same as every other job in this workflow (there is no
  # repo-level nuget.config or .npmrc pinning a proxy feed; enforcing one is tracked separately as
  # part of the #52 infra work). Per this suite's binding rules, if the driver ever stopped
  # shipping inside the package, this job must fail loudly rather than silently reach out for a
  # separate download.
  conformance-browser:
    name: Conformance suite (Category=Browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Create Python venv for the backend under test
        # PythonBackendLauncher (tests/conformance/src/Conformance.Harness)
        # expects a .venv at the repo root with the backend's runtime deps
        # installed -- exactly what a developer's local checkout has.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r app/backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Build frontend (app/backend/static is gitignored and required by app.py's add_static)
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('tests/conformance/Directory.Packages.props', 'tests/conformance/**/*.csproj', 'tests/conformance/**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: dotnet restore tests/conformance (locked mode)
        working-directory: tests/conformance
        # Same rationale as the `conformance` job's identically-named step: every project restores
        # RestorePackagesWithLockFile=true (Directory.Build.props), including Conformance.Tests'
        # Microsoft.Playwright reference, so --locked-mode fails loudly instead of silently
        # re-resolving if the committed lock file and Directory.Packages.props/*.csproj ever
        # disagree.
        run: dotnet restore Conformance.slnx --locked-mode

      - name: Verify a supported browser channel is installed (never downloaded by this job)
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1 || command -v google-chrome >/dev/null 2>&1 || command -v microsoft-edge-stable >/dev/null 2>&1 || command -v microsoft-edge >/dev/null 2>&1; then
            echo "Found an installed browser channel."
          else
            echo "::error::No installed msedge/chrome channel found on this runner -- Conformance.Harness.BrowserChannelPolicy fails the Category=Browser suite loudly in CI rather than skip it silently (see the runner-image regression note in this job's own comment)." >&2
            exit 1
          fi

      - name: dotnet test tests/conformance --filter Category=Browser
        working-directory: tests/conformance
        env:
          CONFORMANCE_BACKEND: python
        run: |
          set -o pipefail
          dotnet test Conformance.slnx \
            --no-restore \
            --filter "Category=Browser" \
            --logger "trx;LogFileName=conformance-browser.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory TestResults \
            --blame-hang --blame-hang-timeout 10min --blame-hang-dump-type mini \
            --blame-crash --blame-crash-dump-type mini \
            2>&1 | tee conformance-browser-output.log

      - name: Upload browser conformance test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results-browser
          path: |
            tests/conformance/TestResults
            tests/conformance/conformance-browser-output.log
          retention-days: 7

  # Issue #129 (Rick, blocks #87 deploy): the Docker build context was ./app, but the Dockerfile's
  # COPY instructions (frontend/, backend/, personas/) assume the repo root, and nothing in CI ever
  # built the image -- so the break (personas/ never found) went unnoticed since #92. This job
  # builds the production image the same way azd does post-#129 (context = repo root, Dockerfile at
  # app/Dockerfile) on every PR/push, with no push to a registry, so a context/COPY regression fails
  # here instead of only surfacing at deploy time. It also asserts persona packs actually land in
  # the image and that the #120 menu/source/ raw-ingestion workbooks do not.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image (no push)
        run: docker build -f app/Dockerfile -t azureaidrivethru-backend:ci .

      - name: Verify the image contents (persona packs load, nothing extra)
        run: |
          set -euo pipefail
          # Every persona pack in the checkout must be in the image.
          expected_packs="$(find personas -mindepth 2 -maxdepth 2 -name persona.json -printf '%h\n' | xargs -n1 basename | sort | tr '\n' ' ')"
          echo "Expected persona packs: ${expected_packs}"
          test -n "${expected_packs}"
          docker run --rm -e PERSONAS_DIR=/app/personas -e EXPECTED_PACKS="${expected_packs}" \
            azureaidrivethru-backend:ci sh -c '
            set -eu
            for id in $EXPECTED_PACKS; do
              test -f "/app/personas/$id/persona.json" || { echo "missing /app/personas/$id/persona.json" >&2; exit 1; }
            done
            # The packs must load and validate inside the container, exactly as the app loads them.
            python -c "
          import os
          from persona_loader import PersonaCatalog
          catalog = PersonaCatalog.load()
          expected = sorted(os.environ[\"EXPECTED_PACKS\"].split())
          assert sorted(catalog.ids) == expected, (sorted(catalog.ids), expected)
          print(\"Loaded persona packs:\", \", \".join(catalog.ids))
          "
            # The frontend is built inside the image.
            test -f /app/static/index.html || { echo "/app/static/index.html missing" >&2; exit 1; }
            # Excluded paths must be absent.
            if [ -e /app/tests ]; then echo "/app/tests leaked into the image" >&2; exit 1; fi
            if find /app/personas -type d -path "*/menu/source" | grep -q .; then
              echo "menu/source/ raw ingestion workbooks leaked into the image" >&2; exit 1
            fi
            if find /app -name ".env*" | grep -q .; then
              echo ".env files leaked into the image:" >&2; find /app -name ".env*" >&2; exit 1
            fi
            if find /app -type d \( -name node_modules -o -name .venv -o -name __pycache__ \) -prune -print | grep -q .; then
              echo "dependency or cache directories leaked into the image" >&2; exit 1
            fi
            echo "Image contents OK."
          '
          size_bytes="$(docker image inspect --format '{{.Size}}' azureaidrivethru-backend:ci)"
          echo "Image size: $((size_bytes / 1024 / 1024)) MiB (${size_bytes} bytes)"
          echo "### Docker image size: $((size_bytes / 1024 / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify app imports with PERSONAS_DIR unset (image-layout fallback)
        run: |
          set -euo pipefail
          # #129 review round 2: PERSONAS_DIR is always set by app/Dockerfile, so the earlier
          # verify step never actually exercises the fallback path resolution the flattened
          # image layout depends on. Unsetting it here and importing the real gunicorn target
          # module (app:create_app) proves the WHOLE import chain -- persona_loader.py,
          # prompt_loader.py, and default_persona.py's own module-level PersonaCatalog.load()
          # call -- resolves /app/personas by existence on its own, not just persona_loader.py
          # in isolation.
          docker run --rm azureaidrivethru-backend:ci sh -c '
            unset PERSONAS_DIR
            python -c "import app; print(\"import app OK with PERSONAS_DIR unset\")"
          '

  # S7 (#17) prep: mirrors docker-build above for app/backend-dotnet/Dockerfile. deployDotnetApp
  # is still false by default (infra/main.bicep) -- this job only proves the IMAGE builds and
  # starts cleanly, not that it's deployed anywhere yet.
  docker-build-dotnet:
    name: Docker image build (C# backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend-dotnet image (no push)
        run: docker build -f app/backend-dotnet/Dockerfile -t azureaidrivethru-backend-dotnet:ci .

      - name: Verify static/config files present, nothing extra leaked in
        run: |
          set -euo pipefail
          docker run --rm azureaidrivethru-backend-dotnet:ci sh -c '
            set -eu
            # The frontend and config.yaml are built/copied into the image (same as the Python one).
            test -f /app/static/index.html || { echo "/app/static/index.html missing" >&2; exit 1; }
            test -f /app/config.yaml || { echo "/app/config.yaml missing" >&2; exit 1; }
            # Excluded paths must be absent: only the published app, personas/, config.yaml and
            # static/ belong in /app -- no source, no test project, no build artifacts.
            if [ -e /app/backend-dotnet ]; then echo "app/backend-dotnet source leaked into the image" >&2; exit 1; fi
            if find / -maxdepth 4 -iname "*Backend.Tests*" 2>/dev/null | grep -q .; then
              echo "Backend.Tests project leaked into the image" >&2; exit 1
            fi
            if find /app \( -name bin -o -name obj -o -name TestResults -o -name "*.user" \) 2>/dev/null | grep -q .; then
              echo "build artifacts leaked into the image" >&2; exit 1
            fi
            if find / -maxdepth 4 -name ".env*" 2>/dev/null | grep -q .; then
              echo ".env files leaked into the image:" >&2; find / -maxdepth 4 -name ".env*" >&2; exit 1
            fi
            echo "Image contents OK."
          '
          size_bytes="$(docker image inspect --format '{{.Size}}' azureaidrivethru-backend-dotnet:ci)"
          echo "Image size: $((size_bytes / 1024 / 1024)) MiB (${size_bytes} bytes)"
          echo "### Docker image (C# backend) size: $((size_bytes / 1024 / 1024)) MiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify persona packs load and /health passes (the C# app's own startup validation)
        run: |
          set -euo pipefail
          # Same expected-pack computation as docker-build's Python verify step above.
          expected_packs="$(find personas -mindepth 2 -maxdepth 2 -name persona.json -printf '%h\n' | xargs -n1 basename | sort | tr '\n' ' ')"
          echo "Expected persona packs: ${expected_packs}"
          test -n "${expected_packs}"

          # Unlike Python's static `python -c "import persona_loader"` trick, Program.cs's
          # startup validation (required env vars -> personas -> config.yaml -> prompts -> model
          # catalog) only runs as part of a live process, so this needs a running container and
          # its /health endpoint (Health/HealthEndpoint.cs), not a module import. The four env
          # vars below are the minimum Program.cs requires to get past its fail-fast startup gate
          # (tests/conformance/src/Conformance.Harness/DotnetBackendLauncher.cs uses the same
          # kind of placeholder values) -- no real Azure call happens at startup this wave.
          container_id="$(docker run -d \
            -e AZURE_OPENAI_EASTUS2_ENDPOINT=https://ci-placeholder.openai.azure.com/ \
            -e AZURE_OPENAI_REALTIME_DEPLOYMENT=ci-placeholder \
            -e AZURE_SEARCH_ENDPOINT=https://ci-placeholder.search.windows.net \
            -e AZURE_SEARCH_INDEX=ci-placeholder \
            -p 8000:8000 \
            azureaidrivethru-backend-dotnet:ci)"
          trap 'docker logs "$container_id" || true; docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health -o /tmp/health.json; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend never responded on /health" >&2
              exit 1
            fi
            sleep 1
          done

          cat /tmp/health.json
          status="$(jq -r '.status' /tmp/health.json)"
          test "$status" = "healthy" || { echo "status was '$status', not 'healthy'" >&2; exit 1; }
          jq -e '.checks | to_entries | all(.value == true)' /tmp/health.json >/dev/null \
            || { echo "one or more startup checks did not pass" >&2; exit 1; }

          actual_packs="$(jq -r '.personas[]' /tmp/health.json | sort | tr '\n' ' ')"
          if [ "${actual_packs% }" != "${expected_packs% }" ]; then
            echo "Persona packs mismatch: expected [${expected_packs% }] got [${actual_packs% }]" >&2
            exit 1
          fi
          echo "C# backend /health OK: personas = ${actual_packs% }"

  # Issue #24: single aggregate required-status-check. Branch protection now pins only this job's
  # name, so growing the `conformance` matrix (e.g. adding backend: dotnet in S2) or adding a new
  # job to `needs:` below never requires another branch-protection edit -- it's added to `needs`
  # here and the success check (below) derives itself from `needs` rather than a second,
  # independently-maintained job-name list (#28 N27: a duplicated list is exactly the kind of thing
  # that silently drifts when a job like conformance-browser is added and this list isn't updated
  # in lockstep).
  #
  # `if: always()` is required so this job still runs (and can fail) even when an upstream job
  # fails or is cancelled -- by default a failed dependency would skip this job instead, and a
  # required check that never ran is not the same as a required check that explicitly failed.
  conformance-gate:
    name: conformance-gate
    needs: [python-tests, frontend-tests, dotnet-tests, conformance, conformance-browser, docker-build, docker-build-dotnet]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs succeeded
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          # #28 M1 (Rick's review, PR #52): fail on ANY result that isn't exactly `success` --
          # not just `failure`/`cancelled`. A `needs` result can also come back `skipped` (a
          # job-level `if:`, a path filter, a hashFiles-gated leg, or a dependency added between
          # jobs later), and a naive two-condition check would silently let a skip through as
          # green. The gate is meant to be the only required status check, so it must not go
          # green when a required job never actually ran.
          #
          # #28 N27 (Rick's review, PR #54): derive the pass/fail decision from `toJSON(needs)`
          # itself instead of a hand-maintained "name:result" pair list -- the `needs:` array
          # above is the single source of truth for which jobs are required, so a job added there
          # is automatically checked here with no second edit needed.
          echo "${NEEDS_CONTEXT}" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          echo "${NEEDS_CONTEXT}" | jq -e 'all(.[]; .result == "success")' >/dev/null || {
            echo "One or more required jobs did not succeed (see results above)."
            exit 1
          }
          echo "All required jobs passed."
