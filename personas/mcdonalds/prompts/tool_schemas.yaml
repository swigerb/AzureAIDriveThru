version: "1.0.0"
tools:
  - name: "search"
    type: "function"
    description: >-
      Search the McDonald's menu for items, prices, sizes, and availability.
      The menu data is in English — translate to and from English if needed.
      Results are formatted as a source name first in square brackets, followed
      by the text content, and a line with '-----' at the end of each result.
    parameters:
      type: "object"
      properties:
        query:
          type: "string"
          description: "Search query for McDonald's menu items (e.g., 'Big Mac', 'number 1 meal', 'McFlurry sizes')"
      required:
        - "query"
      additionalProperties: false

  - name: "update_order"
    type: "function"
    description: "Update the current McDonald's order by adding, removing, or modifying menu items on the order screen."
    parameters:
      type: "object"
      properties:
        action:
          type: "string"
          description: "Use add for an extra item, remove to delete, modify to resize the same item, or replace to atomically swap one included meal side/drink. For replace, item_name is the NEW item, original_item_name is the OLD included item, size is the new size, quantity must be 1."
          enum:
            - "add"
            - "remove"
            - "modify"
            - "replace"
        item_name:
          type: "string"
          description: "Name of the McDonald's menu item to update, e.g., 'Big Mac'."
        original_item_name:
          type: "string"
          description: "Required for replace: exact existing included side/drink name from get_order. Replaces one physical meal slot only; never a standalone line."
        combo_index:
          type: "integer"
          minimum: 0
          description: "For replace when several meal lines contain the old item: zero-based items array index from get_order, after clarifying which meal the guest means. One of identical units on that line is changed."
        size:
          type: "string"
          description: "Size of the item to update, e.g., 'Large'."
        quantity:
          type: "integer"
          description: "Quantity of the item to update. Represents the number of items."
        price:
          type: "number"
          description: "Ignored; the server prices from the menu."
      required:
        - "action"
        - "item_name"
        - "size"
        - "quantity"
      additionalProperties: false

  - name: "get_order"
    type: "function"
    description: "Retrieve the current McDonald's order summary from the order screen, including all items and the total."
    parameters:
      type: "object"
      properties: {}
      required: []
      additionalProperties: false

  - name: "reset_order"
    type: "function"
    description: "Clear all items from the current McDonald's order and start a fresh order."
    parameters:
      type: "object"
      properties: {}
      required: []
      additionalProperties: false
