version: "1.0.0"
# #165 round 3 (Rick R11): the 134->70 item menu swap collapsed the old, more granular category
# set (meals & combos / burgers / chicken & fish sandwiches / mcnuggets & tenders / beverages /
# mccafé coffees / fries & sides) into the 5 categories that ship in menuItems.json today
# ("Burgers & Sandwiches", "Chicken & McNuggets®", "Breakfast", "Fries, Sides & Drinks",
# "Sweets & Treats"). trigger_categories below is remapped to those real, lower-cased category
# strings (menu_utils.py's MenuCatalog.infer_category output) so get_upsell_hint no longer
# silently falls through to "generic" for burger/meal/drink/side adds. Each category below now
# sits in exactly one bucket (get_upsell_hint/GetUpsellHint both match only the first bucket whose
# trigger_categories contains the item's category, so a category in two buckets makes the second
# unreachable): "Fries, Sides & Drinks" merges what used to be two separate categories, so it has
# one combined side-or-drink bucket rather than a "drink" and a "side" bucket racing for the same
# category. "Chicken & McNuggets®" also holds every lunch meal combo (Big Mac® Meal, etc. -- dev's
# "meals & combos" has no 1:1 replacement category here), so the burger/chicken hint text below
# does not offer "make it a meal", since plenty of the items it fires for already are one.
upsell_hints:
  meal:
    trigger_categories:
      - "breakfast"
    hint: "Meals are a great base! Ask if they want to upgrade to a Large size, or add a delicious dessert like a Baked Apple Pie!"

  burger:
    trigger_categories:
      - "burgers & sandwiches"
      - "chicken & mcnuggets®"
    hint: "Great choice! Ask if they'd like to add a dessert or a refreshing drink to go with that!"

  side_or_drink:
    trigger_categories:
      - "fries, sides & drinks"
    hint: "Nice pick! Ask if they'd like to add a burger, chicken sandwich, or a sweet treat to complete their order!"

  sweet:
    trigger_categories:
      - "sweets & treats"
    hint: "Yum! Great pick! Ask if they'd like to add anything else to their order!"

  generic:
    trigger_categories: []
    hint: "Ask if they'd like to add anything else — maybe a drink, side, or dessert!"

system_hints:
  combo_incomplete: "SYSTEM HINT: {{prompt_hint}}"
  out_of_stock: "OOS: {{oos_reason}}"

delta_templates:
  item_added: "Added {{quantity}} {{display_name}} — your total is now {{total}}"
  item_removed: "Removed {{quantity}} {{display_name}} — your total is now {{total}}"
