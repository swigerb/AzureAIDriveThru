version: "1.0.0"
upsell_hints:
  combo:
    trigger_categories:
      - "combos"
    hint: "Combos are a great base! Ask if they want to upgrade to a Large size, or add a delicious Shake or Dessert!"

  burger:
    trigger_categories:
      - "burgers"
      - "burgers & sandwiches"
    hint: "Perfect choice! Ask if they want to make it a combo meal with Tots or Fries and a refreshing Drink!"

  drink:
    trigger_categories:
      - "drinks"
      - "slushes"
    hint: "Great drink choice! Ask if they want to add a Flavor Add-In to customize it, or pair it with a tasty side!"

  shake:
    trigger_categories:
      - "shakes"
      - "desserts"
      - "shakes & ice cream"
    hint: "Yum! Shakes are perfect on their own, but ask if they'd like to add Whipped Cream or pair with a snack!"

  side:
    trigger_categories:
      - "sides"
      - "hot dogs"
      - "hot dogs & tots"
    hint: "Tasty! Ask if they want to add a refreshing Drink or Slush to complete their meal!"

  generic:
    trigger_categories: []
    hint: "Ask if they'd like to add anything else — maybe a drink, side, or dessert!"

system_hints:
  combo_incomplete: "SYSTEM HINT: {{prompt_hint}}"
  out_of_stock: "OOS: {{oos_reason}}"

delta_templates:
  item_added: "Added {{quantity}} {{display_name}} — your total is now {{total}}"
  item_removed: "Removed {{quantity}} {{display_name}} — your total is now {{total}}"
  # #77/#184: `modify` is engine-supported shared code, present for parity with
  # item_added/removed. Sonic's own prompt now calls it for an in-place combo component
  # resize (tool_schemas.yaml lists it alongside add/remove) -- the generic text below is a
  # fallback only, since a genuine whole-item size change is handled by tools.py's own
  # "Upgraded ... from ... to ..." branch before this template is ever read.
  item_modified: "Changed {{display_name}} — your total is now {{total}}"
