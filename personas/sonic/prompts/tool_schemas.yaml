version: "1.0.0"
tools:
  - name: "search"
    type: "function"
    description: >-
      Search the Sonic Drive-In menu for items, prices, sizes, and availability.
      The menu data is in English — translate to and from English if needed.
      Results are formatted as a source name first in square brackets, followed
      by the text content, and a line with '-----' at the end of each result.
    parameters:
      type: "object"
      properties:
        query:
          type: "string"
          description: "Search query for Sonic menu items (e.g., 'cheeseburger', 'cherry limeade sizes', 'combo meals')"
      required:
        - "query"
      additionalProperties: false

  - name: "update_order"
    type: "function"
    description: "Update the current Sonic Drive-In order by adding, removing, or modifying menu items on the Carhop Ticket."
    parameters:
      type: "object"
      properties:
        action:
          type: "string"
          description: "Use add for an extra item, remove to delete, modify to resize the same item, or replace to atomically swap one included combo side/drink. For replace, item_name is the NEW item, original_item_name is the OLD included item, size is the new size, quantity must be 1."
          enum:
            - "add"
            - "remove"
            - "modify"
            - "replace"
        item_name:
          type: "string"
          description: "Name of the Sonic menu item to update, e.g., 'Cherry Limeade'."
        original_item_name:
          type: "string"
          description: "Required for replace: exact existing included side/drink name from get_order. Replaces one physical combo slot only; never a standalone line."
        combo_index:
          type: "integer"
          minimum: 0
          description: "For replace when several combo lines contain the old item: zero-based items array index from get_order, after clarifying which meal the guest means. One of identical units on that line is changed."
        size:
          type: "string"
          description: "Size of the item to update, e.g., 'Large'."
        quantity:
          type: "integer"
          description: "Quantity of the item to update. Represents the number of items."
        price:
          type: "number"
          description: "Ignored; the server prices from the menu."
      required:
        - "action"
        - "item_name"
        - "size"
        - "quantity"
      additionalProperties: false

  - name: "get_order"
    type: "function"
    description: "Retrieve the current Sonic Drive-In order summary from the Carhop Ticket, including all items and the total."
    parameters:
      type: "object"
      properties: {}
      required: []
      additionalProperties: false

  - name: "reset_order"
    type: "function"
    description: "Clear all items from the current Sonic Drive-In order and start a fresh Carhop Ticket."
    parameters:
      type: "object"
      properties: {}
      required: []
      additionalProperties: false
