version: "1.0.0"
messages:
  # Search errors
  search_service_unavailable: "I'm sorry, I can't reach our menu data right now."
  search_no_results: "No matching menu entries found."

  # Pricing errors
  price_validation_failed: "Hmm, I had a little glitch with the pricing on that one. Could you say that again?"

  # Customization errors (Dunkin has no invalid-modifier guard today -- persona.json's
  # invalidModifiers is {} -- these keys exist for parity with the shared engine's key set
  # and are never rendered until Dunkin defines invalid mods of its own).
  invalid_mod: "I can't add {{forbidden_item}} to a {{base_name}} — that's a new one! Want to try something else?"
  nonsensical_mod_redirect: "That's a creative idea! How about something else?"

  # Extras validation (ported from the sibling's tools.py apology strings)
  extras_no_base_item: >-
    I can add extras to signature lattes or cold beverages,
    but not to donuts or breakfast sandwiches.
  extras_blocked_category: >-
    I can add extras to signature lattes or cold beverages,
    but I can't add them to donuts or breakfast sandwiches.
  extras_combined_name: >-
    Extras are separate items: add the drink first, then the extra as its own item.

  # No off-menu ordering (issue #73, ADR-001 decision 4: "No off-menu. If it's not on the menu
  # in our source data, you cannot order it."). See personas/sonic/prompts/error_messages.yaml
  # for the full rationale -- same contract, Dunkin wording.
  item_not_on_menu: >-
    I'm sorry, {{item_name}} isn't on our menu. Would you like to try
    something else instead? Use the search tool with the guest's words and
    offer the closest real menu item by its exact name.
  size_not_available: >-
    I'm sorry, {{item_name}} isn't available in that size. We have it in
    {{available_sizes}} -- would you like one of those?

  # Quantity limit messages (ported from the sibling's tools.py f-strings)
  per_item_limit_maxed: >-
    That's a lot of {{item_name}}! We can do up to {{max_per_item}}
    of any one item. You already have {{existing_qty}} —
    would you like to keep it at {{existing_qty}}?
  per_item_limit_partial: >-
    That's a lot of {{item_name}}! We can do up to {{max_per_item}}
    of any one item. I can add {{allowed}} more —
    would you like me to do that?
  total_order_limit_maxed: >-
    Wow, that's a big order! Our drive-thru tops out at
    {{max_total}} items total so we can keep things moving.
    You're already at the max — would you like to swap anything out?
  total_order_limit_partial: >-
    Wow, that's a big order! Our drive-thru tops out at
    {{max_total}} items total so we can keep things moving.
    I can add {{remaining}} more — would you like me to do that?

  # Order reset
  order_cleared: "Order cleared."

  # Tool execution failures -- same contract as Sonic's (swigerb/SonicAIDriveThru#36).
  tool_execution_failed: >-
    Something went wrong with that action and it did not complete. Don't retry it yet --
    call get_order to confirm the order's current state, then ask the guest to repeat
    what they'd like rather than guessing.

  # Tool-failure cap notice -- same contract as Sonic's (swigerb/SonicAIDriveThru#36).
  tool_failure_cap_instructions: >-
    The order system just failed twice in a row and NOTHING was added or changed. Do not
    say an item was added, removed, or changed. Stay upbeat and in character as a Dunkin
    crew member: briefly apologise, say you couldn't update the order just now, and ask the
    guest to repeat what they'd like.
