# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azureaidrivethru
metadata:
  template: aisearch-openai-rag-audio@0.0.3-beta
services:
  backend:
    project: ./app
    language: py
    host: containerapp
    docker:
      remoteBuild: true
      # Issue #129: the Dockerfile's COPY paths (frontend/, backend/, and personas/ at the repo
      # root) assume the build context is the repo root, not this service's ./app project dir --
      # azd resolves a relative `context` against the service directory (see
      # resolveDockerPaths in azd's container_helper.go), so `..` here lands exactly on the repo
      # root. docker.path is left at its default (./Dockerfile, also service-relative), which
      # already points at app/Dockerfile correctly.
      context: ..
  # S7 (#17) prep: app/backend-dotnet builds a real image (this PR), but the azure.yaml service
  # entry itself is deliberately NOT added yet. `language: csharp` here would make azd resolve a
  # dotnet project (editing Backend.csproj's UserSecretsId, writing outputs into dotnet
  # user-secrets) on every provision/package/deploy, and with no matching infra/backend-dotnet
  # resource `azd-service-name: backend-dotnet` tag, `azd deploy`/`azd up` would fail with
  # "unable to find a resource tagged with 'azd-service-name: backend-dotnet'" in every
  # environment that hasn't flipped DEPLOY_DOTNET_APP=true (Rick's #152 review, R1). The #17
  # go-live PR adds this service back with `language: docker` (no csproj handling), `project:
  # ./app`, `docker.path: ./Dockerfile.dotnet` and `docker.context: ..` (mirrors `backend` above),
  # in the same commit that flips infra/main.bicep's deployDotnetApp to true, plus the
  # SERVICE_BACKEND_DOTNET_RESOURCE_EXISTS mapping in infra/main.parameters.json and the
  # 'azd-service-name': 'backend-dotnet' tag on acaBackendDotnet in infra/main.bicep.
hooks:
    postprovision:
      windows:
        shell: pwsh
        run: ./scripts/write_env.ps1; ./scripts/setup_search_index.ps1
        interactive: true
        continueOnError: false
      posix:
        shell: sh
        run: ./scripts/write_env.sh; ./scripts/setup_search_index.sh
        interactive: true
        continueOnError: false
    # Non-fatal: checks the live realtime deployment accepts the carhop's exact
    # session config (tools, tool_choice, instructions) and transcribes a test
    # phrase word for word. Warns, never fails.
    postdeploy:
      windows:
        shell: pwsh
        run: ./scripts/smoke_realtime.ps1
        interactive: false
        continueOnError: true
      posix:
        shell: sh
        run: ./scripts/smoke_realtime.sh
        interactive: false
        continueOnError: true
pipeline:
  variables:
    - AZURE_OPENAI_SERVICE
    - AZURE_OPENAI_RESOURCE_GROUP
    - AZURE_OPENAI_REUSE_EXISTING
    - AZURE_OPENAI_EASTUS2_ENDPOINT
    - AZURE_OPENAI_REALTIME_DEPLOYMENT
    - AZURE_OPENAI_REALTIME_REASONING_EFFORT
    - AZURE_OPENAI_REALTIME_REASONING_MODEL
    - AZURE_OPENAI_REALTIME_TRANSCRIPTION_MODEL
    - AZURE_OPENAI_REALTIME_DEPLOYMENT_CAPACITY
    - AZURE_OPENAI_EMB_DEPLOYMENT_CAPACITY
    - AZURE_OPENAI_EMB_DIMENSIONS
    - AZURE_SEARCH_INDEX
    - AZURE_SEARCH_SEMANTIC_CONFIGURATION
    - AZURE_SEARCH_IDENTIFIER_FIELD
    - AZURE_SEARCH_CONTENT_FIELD
    - AZURE_SEARCH_TITLE_FIELD
    - AZURE_SEARCH_EMBEDDING_FIELD
    - AZURE_SEARCH_USE_VECTOR_QUERY
    - AZURE_SEARCH_SERVICE
    - AZURE_SEARCH_SERVICE_RESOURCE_GROUP
    - AZURE_SEARCH_SERVICE_LOCATION
    - AZURE_SEARCH_SERVICE_SKU
    - AZURE_SEARCH_SEMANTIC_RANKER
    - AZURE_SEARCH_REUSE_EXISTING
    - AZURE_SEARCH_ENDPOINT
    - AZURE_STORAGE_ACCOUNT
    - AZURE_STORAGE_RESOURCE_GROUP
    - AZURE_STORAGE_SKU
    - AZURE_CONTAINER_APP_NAME
    - AZURE_LOG_ANALYTICS
    - AZURE_CONTAINER_APPS_WORKLOAD_PROFILE
    - PERSONAS
    - DEFAULT_PERSONA
    - AZURE_AI_MODEL_DEPLOYMENTS
    - DEPLOY_DOTNET_APP
    - AZURE_CONTAINER_APP_DOTNET_NAME
    - BACKEND_DOTNET_INGRESS_ENABLED
    - ENTRA_TENANT_ID
    - ENTRA_CLIENT_ID
    - ENTRA_API_SCOPE
    - ENTRA_APP_ROLE
