# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azureaidrivethru
metadata:
  template: aisearch-openai-rag-audio@0.0.3-beta
services:
  backend:
    project: ./app
    language: py
    host: containerapp
    docker:
      remoteBuild: true
      # Issue #129: the Dockerfile's COPY paths (frontend/, backend/, and personas/ at the repo
      # root) assume the build context is the repo root, not this service's ./app project dir --
      # azd resolves a relative `context` against the service directory (see
      # resolveDockerPaths in azd's container_helper.go), so `..` here lands exactly on the repo
      # root. docker.path is left at its default (./Dockerfile, also service-relative), which
      # already points at app/Dockerfile correctly.
      context: ..
      # ADR-002 18.8: the frontend's Entra config is baked in at build time (app/Dockerfile's
      # build-stage ARGs), read from the same azd env names Setup-EntraAuth.ps1 prints. A remote
      # build (remoteBuild: true above) must pass these through to ACR -- verify this on the first
      # real Entra deploy; if it doesn't, fall back to remoteBuild: false for this service.
      buildArgs:
        - VITE_AUTH_MODE=Entra
        - VITE_ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
        - VITE_ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
        - VITE_ENTRA_API_SCOPE=${ENTRA_API_SCOPE}
  # S7 (#17 go-live): side-by-side C# container app, beside `backend` above, sharing the same ACA
  # environment, Foundry account, Search service and managed identity (10.2). `language: docker`
  # (not `csharp`) so azd never touches a dotnet project file (no Backend.csproj UserSecretsId
  # edits, no dotnet user-secrets writes) on provision/package/deploy -- it just builds
  # app/Dockerfile.dotnet like any other container service. `project: ./app` + `docker.context: ..`
  # mirror `backend` above for the same reason (issue #129): azd resolves `context` relative to the
  # service dir, and `..` from `./app` lands on the repo root, which both Dockerfiles' COPY paths
  # assume. `docker.path` points directly at the sibling Dockerfile.dotnet (not the default
  # ./Dockerfile) so the two services build from different images out of the same project dir.
  #
  # This service entry, infra/main.bicep's `'azd-service-name': 'backend-dotnet'` tag on
  # acaBackendDotnet (gated behind `if (deployDotnetApp)`, same as the rest of that module) and the
  # SERVICE_BACKEND_DOTNET_RESOURCE_EXISTS mapping in infra/main.parameters.json land together in
  # this one PR (Rick's #152 review, R1), but `deployDotnetApp` (DEPLOY_DOTNET_APP) still defaults
  # to `false` -- this PR stays a deploy-nothing-new, cost-neutral prep until Brian flips it.
  #
  # Operator note (no azd `condition:` support on services as of the pinned azd release -- see
  # https://aka.ms/azure.yaml.json, no such field documented): with DEPLOY_DOTNET_APP=false, the
  # acaBackendDotnet module is never deployed, so NO resource anywhere carries the
  # 'azd-service-name': 'backend-dotnet' tag this service entry expects. A plain `azd deploy` or
  # `azd up` (both iterate every azure.yaml service) then fails this service with "unable to find a
  # resource tagged with 'azd-service-name: backend-dotnet'". Until azd ships a service `condition`,
  # every environment that has not flipped DEPLOY_DOTNET_APP=true MUST scope deploys to the Python
  # service explicitly -- `azd deploy backend` (not bare `azd deploy`/`azd up`) -- and run
  # `azd provision` on its own (provision never resolves service tags, so it is unaffected). See
  # DEPLOY.md's ".NET container app (S7, #17)" section for the full rollout.
  backend-dotnet:
    project: ./app
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile.dotnet
      context: ..
      remoteBuild: true
      # Same build-time Entra config as `backend` above (design 18.8) -- the .NET image's frontend
      # build stage (app/Dockerfile.dotnet) declares and consumes the identical four ARGs/ENVs.
      buildArgs:
        - VITE_AUTH_MODE=Entra
        - VITE_ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
        - VITE_ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
        - VITE_ENTRA_API_SCOPE=${ENTRA_API_SCOPE}
hooks:
    postprovision:
      windows:
        shell: pwsh
        run: ./scripts/postprovision_auth.ps1; ./scripts/write_env.ps1; ./scripts/setup_search_index.ps1
        interactive: true
        continueOnError: false
      posix:
        shell: sh
        run: ./scripts/postprovision_auth.sh; ./scripts/write_env.sh; ./scripts/setup_search_index.sh
        interactive: true
        continueOnError: false
    # Non-fatal: checks the live realtime deployment accepts the carhop's exact
    # session config (tools, tool_choice, instructions) and transcribes a test
    # phrase word for word. Warns, never fails.
    postdeploy:
      windows:
        shell: pwsh
        run: ./scripts/smoke_realtime.ps1
        interactive: false
        continueOnError: true
      posix:
        shell: sh
        run: ./scripts/smoke_realtime.sh
        interactive: false
        continueOnError: true
