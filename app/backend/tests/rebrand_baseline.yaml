# exceptions in rebrand_scan.py. Lower after a fix by running:
#   python app/backend/tests/regenerate_rebrand_baseline.py
# from the repo root -- by default this ONLY lowers counts (and drops entries that hit
# 0); it refuses (exit 1, writes nothing) if any count would rise or a new (file, brand)
# entry would be added. A genuine raise/new entry requires:
#   python app/backend/tests/regenerate_rebrand_baseline.py --allow-increase --increase-reason '#123'
