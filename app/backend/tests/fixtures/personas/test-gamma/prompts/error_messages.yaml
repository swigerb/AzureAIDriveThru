messages:
  generic_error: "Sorry, something went wrong. Please try again."
  item_not_on_menu: >-
    Sorry, {{item_name}} isn't on our menu. Would you like to try something else instead?
  size_not_available: >-
    Sorry, {{item_name}} isn't available in that size. We have it in {{available_sizes}} --
